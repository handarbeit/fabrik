# .fabrik/config.yaml — project-level configuration for Fabrik
# Commit this file to git so project settings travel with the repo.
# Keep secrets (FABRIK_TOKEN, GITHUB_TOKEN) in .env (gitignored).
#
# Precedence: CLI flag > shell env var > .env > .fabrik/config.yaml > built-in default

# Required: GitHub repository owner (org or username)
owner: handarbeit

# Required: GitHub repository name (leave empty for multi-repo mode)
# repo: fabrik

# Required: GitHub project number (the number in the project URL)
project: 1

# Required: Your GitHub username (Fabrik only processes issues assigned to you)
user: arbeithand

# Optional settings (defaults shown):
# stages: ./.fabrik/stages
poll: 180
max_concurrent: 5
# max_retries: 3
# yolo: false
auto_upgrade: true
# Re-enabled 2026-05-05 after the cache-coherency cluster landed (Phase 3-A through 3-H,
# plus #537 single-Store unification). Verification per docs/cache-refactor/04-phase4-audit.md §6.
webhooks: false  # App auth: gh webhook forward is user-token only; event_source: hookdeck is the App-mode path
# Event-driven ingestion under App auth (#1142): GitHub App fabrik-dev-daemon's webhook
# -> Hookdeck source -> CLI session. The secrets are named, not stored: HOOKDECK_API_KEY and
# FABRIK_GITHUB_WEBHOOK_SECRET live in .env. Polling stays on as the correctness backstop.
event_source: hookdeck
hookdeck_api_key_env: HOOKDECK_API_KEY
hookdeck_webhook_secret_env: FABRIK_GITHUB_WEBHOOK_SECRET
tui: true

# Merge train (ADR-059): yolo items completing Validate advance to the Queued
# holding stage instead of auto-merging individually, then land as one batched
# integration PR. Requires a "Queued" column on the board matching
# .fabrik/stages/queued.yaml.
#
# MUST be quoted: unquoted `on` is parsed as YAML boolean true, which fails to
# unmarshal into the string field and silently leaves the train off.
#
# Note: fabrik:cruise items never enter the train — cruise short-circuits ahead
# of the merge-train gate (engine/stages.go:246), leaving the PR for a human.
# Only fabrik:yolo items are batched.
merge_train: "on"
# Red-singleton auto-repair (#2045, ADR-2045): when a trial is red for one member alone,
# re-enter Validate for it (with the failure details and an instruction to reconcile with
# what landed) instead of pausing it for a human. Attempts per member per base commit
# before it pauses; default 1, 0 disables auto-repair (restores the ADR-1545 pause).
# The counter is in memory — a restart resets it. Also: --max-train-auto-repair-attempts
# flag / FABRIK_MAX_TRAIN_AUTO_REPAIR_ATTEMPTS env var.
# max_train_auto_repair_attempts: 1
# Path globs left out of the merge-train overlap check (#2047): a fresh batch never
# holds two members that change the same non-ignored path. "*" does not cross "/"
# ("*.lock" is top-level only; use "**/*.lock"); "**" spans directories. Default none.
# Also: --merge-train-overlap-ignore flag (comma-separated) /
# FABRIK_MERGE_TRAIN_OVERLAP_IGNORE env var.
# merge_train_overlap_ignore: ["**/*.lock", "CHANGELOG.md"]
# debug_output: false
# symlink_env: false    # When true, creates a relative symlink at <worktree>/.env pointing to the fabrikDir .env.
#                       # Enables worktree-based stages to pick up credentials (e.g. ANTHROPIC_API_KEY) from .env.
#                       # No-op when source .env is absent; never overwrites an existing .env in the worktree.
#                       # Also: --symlink-env flag / FABRIK_SYMLINK_ENV env var.
