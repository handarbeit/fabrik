# Dependency updates arrive as PRs to judge on their own merits: merge the
# green ones. A major that needs code changes is better done as a worked PR
# of its own; close the Dependabot PR (which ignores that version) once that
# work is under way. Weekly, Saturdays 04:00 Eastern.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Majors match no group, so each gets a PR of its own.
    groups:
      non-major:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /docs
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Majors match no group, so each gets a PR of its own.
    groups:
      non-major:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
