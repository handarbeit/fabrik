name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -s matches the -s (simplify) flag CONTRIBUTING.md already tells
      # contributors to run locally (`gofmt -s -d .` / `gofmt -s -w .`).
      # Cheapest check in the job (no build), so it runs first.
      - name: gofmt
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt -s clean:"
            echo "$files"
            echo ""
            echo "Run 'gofmt -s -w .' and commit the result."
            exit 1
          fi

      # -tags e2e so the build-tagged e2e suite is vetted too. Without the tag
      # `go vet ./...` matches no packages under tests/e2e, so that code is
      # never vetted at all.
      - name: go vet
        run: go vet -tags e2e ./...

      - name: Test hygiene lint
        run: |
          if grep -rn '"/tmp/' --include="*_test.go" .; then
            echo "ERROR: hardcoded /tmp/ paths found in test files. Use t.TempDir() instead."
            exit 1
          fi
          if grep -rn 'nonexistent-xyz' --include="*_test.go" .; then
            echo "ERROR: network-dependent failure injection found. Use ENAMETOOLONG instead."
            exit 1
          fi

      - name: go test
        # TestExecute_ConfigYAMLApplied is a timing-sensitive SIGINT integration
        # test that fails intermittently on CI; it is tracked separately.
        #
        # -parallel capped via scripts/lib/parallel.sh's default_race_parallel
        # (REQ4, #1677): this invocation includes the same git-forking
        # tests/sim package that scripts/sim/run.sh's own SIM_PARALLEL caps
        # locally — capping it here too keeps both entry points coherent
        # rather than one being a no-op protection. CI's runners are 2-4
        # cores (well below the min(4, cores) ceiling), so this is a no-op
        # in practice today and exists for future-proofing / consistency,
        # not because CI has ever reproduced the fork/exec SIGSEGV this cap
        # guards against — see scripts/lib/parallel.sh's own header comment.
        run: |
          source scripts/lib/parallel.sh
          go test -race -timeout 5m -parallel "$(default_race_parallel)" -skip TestExecute_ConfigYAMLApplied ./...

      # Compile the e2e suite without running it. The scenarios are behind the
      # `e2e` build tag and drive a real Fabrik bed against real repos, so they
      # can't run in CI — but that also meant ~4k lines were never compiled
      # here, and a signature change in engine/ or github/ could silently break
      # the harness. The break would then only surface when someone runs the
      # release gate, mid-release. `-run '^$'` matches no test, so this builds
      # the test binary (catching errors inside Test functions, not just
      # package code) and exits without executing a scenario or making any
      # network call. There is no TestMain, so nothing runs. Takes <1s.
      - name: compile e2e suite (not run)
        run: go test -tags e2e -run '^$' ./tests/e2e/...

      # The live-gate runner (scripts/e2e/run.sh is a shim over tests/gate,
      # #1994, ADR-1994) is ordinary Go with no build tag, so its regression
      # coverage — the pre-gate and its SHA dedup (#1454, #1624), the
      # rate-limit-backoff scan (#1527, #1547), the competing-token and
      # reviewer-reachable preconditions (#1684), the auth-mode legs (#1861),
      # E2E_BED_REF resolution (#1693), bed git-config isolation (#1756), the
      # hang-protection and exit-code contract (#1676, #1694) — runs inside the
      # `go test -race ./...` step above. It needs no bed, token, network or `gh`
      # login: fake subprocesses, recorded `go test -json` streams and real git
      # on scratch repos. (These were nine `bash scripts/e2e/*_test.sh` steps.)

      # cut-release.sh's flag parsing — in particular --skip-integration's
      # validation (R2, #1454) — sourced and exercised directly via
      # parse_args(), never reaching main() (the real publish sequence). No
      # bed, network, git remote, or publish path touched; see that script's
      # own dispatch-guard comment for why sourcing it here is safe.
      - name: cut-release flag/gate regression test (#1454)
        run: bash scripts/cut_release_gate_test.sh

      # ADR citation integrity. ADRs are numbered after their originating
      # issue (CLAUDE.md's "ADR numbering"), so issue and ADR numbers share
      # one namespace and "ADR-1303" vs "#1303" is a one-token, invisible
      # slip — one that shipped in adrs/1408-*.md and survived until a manual
      # sweep. The docs-drift workflow does not cover this: it regenerates
      # docs/llms-full.txt and diffs it, verifying the bundle matches its
      # sources rather than verifying any claim. Pure text/filesystem check —
      # no build, no network.
      - name: ADR reference integrity
        run: bash scripts/check-adr-references.sh

      # Cross-file invariants in the entwurf plugin. Four review rounds found the
      # same class of defect every time — a rule fixed in one skill and left broken
      # in its mirror — so the mirrors are asserted mechanically rather than by
      # review. Pure text check: no build, no network.
      - name: Entwurf plugin consistency
        run: python3 scripts/check-entwurf-consistency.py
