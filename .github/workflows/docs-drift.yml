name: Docs drift check

on:
  pull_request:

permissions:
  contents: read

# Cancel a run when a newer commit lands on the same PR or branch. Every run for the default
# branch or a tag gets a group of its own (keyed by run id), so it is never cancelled or replaced:
# GitHub keeps only one pending run per group, and a tag and a main push can share a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  check-llms-full:
    name: Verify llms-full.txt is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Regenerate llms-full.txt
        run: bash scripts/generate-llms-full.sh

      - name: Fail if llms-full.txt is out of date
        run: |
          if ! git diff --exit-code docs/llms-full.txt; then
            echo ""
            echo "docs/llms-full.txt is out of date."
            echo "Run 'scripts/generate-llms-full.sh' and commit the result alongside your doc changes."
            exit 1
          fi
